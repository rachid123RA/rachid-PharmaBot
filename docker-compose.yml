version: '3.8'

# PharmaBot — Docker Compose
# Compatible macOS ARM64 (Apple Silicon M1/M2/M3) + Ubuntu 22.04
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  COMMANDES RAPIDES                                                      │
# │                                                                         │
# │  🤖 DÉMO ROBOT (voir le robot travailler) :                             │
# │    docker compose run pharmabot-demo                                    │
# │                                                                         │
# │  🧪 Tests Python (LÉGER, ~50MB, 30 secondes) :                          │
# │    docker compose run pharmabot-tests                                   │
# │    docker compose run pharmabot-p34                                     │
# │                                                                         │
# │  🐳 Shell ROS2 interactif (COMPLET, ~3GB, 5 min à builder) :           │
# │    docker compose run pharmabot-shell                                   │
# └─────────────────────────────────────────────────────────────────────────┘

services:

  # ── 🤖 DÉMO ROBOT (voir le robot en action, terminal visuel) ────────────
  pharmabot-demo:
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: pharmabot-tests:latest
    container_name: pharmabot_demo
    working_dir: /ros2_ws
    command: python3 demo_robot.py
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - TERM=xterm-256color

  # ── Tests Phase 1+2 (LÉGER — Python 3.10 slim, ~50MB) ──────────────────
  pharmabot-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: pharmabot-tests:latest
    container_name: pharmabot_tests_p12
    working_dir: /ros2_ws
    command: python3 tests/run_tests_phase1_phase2.py -v
    environment:
      - PYTHONUNBUFFERED=1

  # ── Tests Phase 3+4 (LÉGER — Python 3.10 slim, ~50MB) ──────────────────
  pharmabot-p34:
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: pharmabot-tests:latest
    container_name: pharmabot_tests_p34
    working_dir: /ros2_ws
    command: python3 tests/run_tests_phase3_phase4.py -v
    environment:
      - PYTHONUNBUFFERED=1

  # ── Tous les tests d'un coup ─────────────────────────────────────────────
  pharmabot-all-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: pharmabot-tests:latest
    container_name: pharmabot_all_tests
    working_dir: /ros2_ws
    command: >
      /bin/bash -c "
        echo '════ PHASE 1+2 ════' &&
        python3 tests/run_tests_phase1_phase2.py -v &&
        echo '' &&
        echo '════ PHASE 3+4 ════' &&
        python3 tests/run_tests_phase3_phase4.py -v
      "
    environment:
      - PYTHONUNBUFFERED=1

  # ── Shell ROS2 interactif (COMPLET — ~3GB, builder 1 fois) ──────────────
  pharmabot-shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmabot-ros2:latest
    container_name: pharmabot_shell
    working_dir: /ros2_ws
    stdin_open: true
    tty: true
    command: /bin/bash
    environment:
      - ROS_DOMAIN_ID=42
      - PYTHONUNBUFFERED=1

  # ── EDF RT Scheduler seul (sans Gazebo) ──────────────────────────────────
  pharmabot-rt:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmabot-ros2:latest
    container_name: pharmabot_rt_scheduler
    working_dir: /ros2_ws
    command: >
      /bin/bash -c "
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash 2>/dev/null || true &&
        ros2 run hospital_robot_spawner rt_scheduler
      "
    environment:
      - ROS_DOMAIN_ID=42
      - PYTHONUNBUFFERED=1

  # ── Tous les nœuds (sans Gazebo) ─────────────────────────────────────────
  pharmabot-nodes:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmabot-ros2:latest
    container_name: pharmabot_all_nodes
    working_dir: /ros2_ws
    command: >
      /bin/bash -c "
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash 2>/dev/null || true &&
        ros2 launch hospital_robot_spawner pharmabot_full.launch.py
      "
    environment:
      - ROS_DOMAIN_ID=42
      - PYTHONUNBUFFERED=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
